services:
  kojima-movie-sync:
    image: ghcr.io/mblackman/tiddlywiki-kojima-media:latest
    build: .
    container_name: kojima-movie-sync
    volumes:
      - kojima_data:/data
    environment:
      - PORT=8765
      - KOJIMA_DB_PATH=/data/kojima_reviews.db
      # Optional: TMDB API Key to resolve newly scraped X posts automatically
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      # Optional: Comma-separated X/Nitter or Letterboxd RSS feed URLs for background polling
      - KOJIMA_RSS_URLS=${KOJIMA_RSS_URLS:-}
      - SCRAPE_INTERVAL_SECONDS=${SCRAPE_INTERVAL_SECONDS:-3600}
      # Optional review classifier for X posts: "gemini", "openai", "ollama", or "heuristic" keywords (default)
      - LLM_PROVIDER=${LLM_PROVIDER:-heuristic}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434/api/generate}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1}
    ports:
      - "8765:8765"
    restart: unless-stopped

volumes:
  kojima_data:
