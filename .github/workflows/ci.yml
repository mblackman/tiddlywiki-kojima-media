name: CI & Scheduled Recommendations Sync

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Runs daily at 06:00 UTC to refresh the Kojima movie recommendations feed & demo site
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      force_rescore:
        description: "Re-rate every movie (run once after changing LLM_PROVIDER)"
        type: boolean
        default: false

# Workflow-level so every generate-feed run (including the one inside build-all)
# uses the same provider; it is part of each entry's content hash.
env:
  LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'heuristic' }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync & score Kojima recommendations feed
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          KOJIMA_RSS_URLS: ${{ vars.KOJIMA_RSS_URLS || secrets.KOJIMA_RSS_URLS }}
        run: npm run generate-feed

      - name: Run tests
        run: npm test

      - name: Build plugin, demo wiki, static API feed, and CPL library
        run: npm run build-all

      - name: Upload plugin & feed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kojima-media-plugin
          path: |
            build/kojima-media.tid
            build/kojima-media-plugin.json
            dist/kojima-media-plugin.json
            build/index.html
            build/api/kojima-recommendations.json
          if-no-files-found: error
          retention-days: 14

  deploy-pages:
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync & score Kojima recommendations feed
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          KOJIMA_RSS_URLS: ${{ vars.KOJIMA_RSS_URLS || secrets.KOJIMA_RSS_URLS }}
        run: npm run generate-feed -- ${{ inputs.force_rescore && '--force-rescore' || '' }}

      - name: Commit updated seed dataset if new recommendations were scraped
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if ! git diff --quiet demo/seed-recommendations.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add demo/seed-recommendations.json
            git commit -m "chore(data): update Kojima movie recommendations feed [skip ci]"
            git push origin HEAD:main
          fi

      - name: Build demo wiki & static JSON feed
        run: npm run build-all

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
